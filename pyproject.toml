[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llmrouter"
version = "0.1.0"
description = "A local-first, budget-aware gateway for routing LLM calls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.22,<5",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.scripts]
llmrouter = "llmrouter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/llmrouter"]
include = ["src/llmrouter/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
